# MWU 部署工作流：用本文件替换 MaaPracticeBoilerplate 模板中的 .github/workflows/install.yml，
# 即可把通用 UI 切换为 MWU。项目结构沿用模板（assets/interface.json、assets/resource、agent/），
# 每个平台发布两个包：完整包 <仓库名>-<平台>-<架构>-<版本>.7z（MWU 本体 + 资源），
# 资源包 <仓库名>-resource-<平台>.<架构>-<版本>.7z（只含资源），另附 mwu-release.json 记录所用 MWU 版本。
# 客户端在 MWU 版本未变时只下载资源包，升级了 MWU_VERSION 后自动改下完整包。
# Mirror酱只需上传完整包（文件名匹配 <仓库名>-<平台>-<架构>-*），增量包由 Mirror酱 生成。
name: install

env:
  # 设置为空字符串时下载 MWU 最新版本，设置为具体版本号（如 v1.2.3）时下载指定版本
  MWU_VERSION: ""
  # Agent 黑魔法依赖的目标 Python 版本，需与 MWU 内置 Python 一致
  PYTHON_VERSION: "3.13"

on:
  push:
    tags:
      - "v*"
    branches:
      - "**"
    paths:
      - ".github/workflows/install.yml"
      - "assets/**"
      - "agent/**"
      - "**.py"
      - "requirements.txt"
  pull_request:
    branches:
      - "**"
    paths:
      - ".github/workflows/install.yml"
      - "assets/**"
      - "agent/**"
      - "**.py"
      - "requirements.txt"
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  meta:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: set_tag
        run: |
          # 检查标签格式
          is_release=${{ startsWith(github.ref, 'refs/tags/v') }}
          tag=$(git describe --tags --match "v*" ${{ github.ref }} || true)
          if [[ $tag != v* ]]; then
            tag=$(curl -sX GET "https://api.github.com/repos/${{ github.repository }}/releases/latest" --header 'authorization: Bearer ${{ secrets.GITHUB_TOKEN }}' | awk '/tag_name/{print $4}' FS='["]')
            if [[ $tag != v* ]]; then
              tag="v0.0.0"
            fi
            tag=$(date "+$tag-%y%m%d-$(git rev-parse --short HEAD)")
          fi

          if ! $($is_release) ; then
            prefix=${tag%-*-*}
            suffix=${tag#$prefix-}
            tag="$prefix-ci.$suffix"
          fi

          # 检查是否为预发布版本
          is_prerelease=false
          if [[ $tag =~ .*alpha.* || $tag =~ .*beta.* || $tag =~ .*rc.* || $tag =~ .*dev.* || $tag =~ .*-ci.* ]]; then
            is_prerelease=true
            echo "This is a pre-release version"
          fi

          echo tag=$tag | tee -a $GITHUB_OUTPUT
          echo is_release=$is_release | tee -a $GITHUB_OUTPUT
          echo is_prerelease=$is_prerelease | tee -a $GITHUB_OUTPUT
          echo repo_name=${GITHUB_REPOSITORY#*/} | tee -a $GITHUB_OUTPUT
      # 所有平台使用同一个 MWU 版本，并写入 mwu-release.json
      - id: set_mwu
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mwu_version="${MWU_VERSION}"
          if [[ -z $mwu_version ]]; then
            mwu_version=$(gh release view --repo ravizhan/MWU --json tagName -q .tagName)
          fi
          echo mwu_version=$mwu_version | tee -a $GITHUB_OUTPUT
    outputs:
      tag: ${{ steps.set_tag.outputs.tag }}
      is_release: ${{ steps.set_tag.outputs.is_release }}
      is_prerelease: ${{ steps.set_tag.outputs.is_prerelease }}
      repo_name: ${{ steps.set_tag.outputs.repo_name }}
      mwu_version: ${{ steps.set_mwu.outputs.mwu_version }}

  install:
    needs: meta
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            os: linux
            arch: x86_64
          - runner: ubuntu-24.04-arm
            os: linux
            arch: aarch64
          - runner: macos-15-intel
            os: macos
            arch: x86_64
          - runner: macos-15
            os: macos
            arch: aarch64
          - runner: windows-2025
            os: win
            arch: x86_64
          - runner: windows-11-arm
            os: win
            arch: aarch64
    runs-on: ${{ matrix.runner }}
    env:
      tag: ${{ needs.meta.outputs.tag }}
      package_name: ${{ needs.meta.outputs.repo_name }}-${{ matrix.os }}-${{ matrix.arch }}-${{ needs.meta.outputs.tag }}
      resource_package_name: ${{ needs.meta.outputs.repo_name }}-resource-${{ matrix.os }}.${{ matrix.arch }}-${{ needs.meta.outputs.tag }}

    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true

      - name: Workaround for missing zstd in windows-11-arm
        if: matrix.runner == 'windows-11-arm'
        run: choco install zstandard

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          activate-environment: true

      - name: Download MWU
        id: download_mwu
        uses: robinraju/release-downloader@v1
        with:
          repository: ravizhan/MWU
          fileName: "MWU-${{ matrix.os }}-${{ matrix.arch }}-*.7z"
          tag: ${{ needs.meta.outputs.mwu_version }}
          out-file-path: "mwu"

      # client/ 保留原样的 MWU 本体，用于区分安装目录中哪些文件属于本体、哪些属于资源
      - name: Extract MWU
        shell: bash
        run: |
          7z x "${{ fromJson(steps.download_mwu.outputs.downloaded_files)[0] }}" -obuild -y
          7z x "${{ fromJson(steps.download_mwu.outputs.downloaded_files)[0] }}" -oclient -y

      - name: Install
        shell: bash
        run: |
          curl -fsSL https://github.com/ravizhan/MWU/raw/refs/heads/main/deploy/copy_resources.py -o ./copy_resources.py
          uv run --no-project ./copy_resources.py
          curl -fsSL https://github.com/ravizhan/MWU/raw/refs/heads/main/deploy/download_deps.py -o ./download_deps.py
          uv run --no-project ./download_deps.py
          curl -fsSL https://github.com/ravizhan/MWU/raw/refs/heads/main/deploy/package.py -o ./package.py
          uv run --no-project ./package.py

      - name: Compress
        shell: bash
        run: |
          7z a -t7z -mx=9 -myx=9 -mmt -ms=e -mqs=on -mf=BCJ2 -r "${package_name}.7z" "./build/*"
          7z a -t7z -mx=9 -myx=9 -mmt -ms=e -mqs=on -r "${resource_package_name}.7z" "./resource/*"

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ env.package_name }}
          path: |
            ${{ env.package_name }}.7z
            ${{ env.resource_package_name }}.7z

  changelog:
    name: Generate changelog
    needs: meta
    runs-on: ubuntu-latest
    outputs:
      release_body: ${{ steps.git-cliff.outputs.content }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Generate a changelog
        uses: orhun/git-cliff-action@v4
        id: git-cliff
        with:
          config: .github/cliff.toml
          # 正式版：使用 tag-pattern 只匹配正式版标签，包含所有从上一个正式版以来的提交
          # 预发布版：正常生成，只包含从上一个标签以来的提交
          args: >-
            -vv --latest --strip header
            ${{ needs.meta.outputs.is_prerelease == 'false' && '--tag-pattern "^v[0-9]+\\.[0-9]+\\.[0-9]+$"' || '' }}
        env:
          OUTPUT: CHANGES.md
          GITHUB_REPO: ${{ github.repository }}

  release:
    if: ${{ needs.meta.outputs.is_release == 'true' }}
    needs: [meta, install, changelog]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: release
          merge-multiple: true

      - name: Write release info
        run: |
          echo '{"version": "${{ needs.meta.outputs.tag }}", "mwu_version": "${{ needs.meta.outputs.mwu_version }}"}' > release/mwu-release.json

      - uses: softprops/action-gh-release@v2
        with:
          files: |
            release/*.7z
            release/mwu-release.json
          tag_name: ${{ needs.meta.outputs.tag }}
          body: ${{ needs.changelog.outputs.release_body }}
          draft: false
          prerelease: ${{ needs.meta.outputs.is_prerelease == 'true' }}

        # Mirror酱为第三方分发服务，新项目默认关闭
        # 若有需要请联系 Mirror酱 开通，直接自行开启是无法使用的
        # https://mirrorchyan.com/
      - name: Trigger MirrorChyanUploading
        if: false
        shell: bash
        run: |
          gh workflow run --repo $GITHUB_REPOSITORY mirrorchyan_release.yml -f tag=${{ needs.meta.outputs.tag }}
          gh workflow run --repo $GITHUB_REPOSITORY mirrorchyan_release_note.yml -f tag=${{ needs.meta.outputs.tag }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
