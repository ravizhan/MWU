[project]
name = "MWU"
version = "0.17.0"
description = "基于 Vue 的 通用 GUI。由 MaaFramework 强力驱动！"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "apscheduler>=3.11.3",
    "cron-converter>=2.0.1",
    "fastapi>=0.141.1",
    "httpx>=0.28.1",
    "maafw==5.13.0b6",
    "numpy>=2.3.5",
    "pillow>=12.3.0",
    "plyer>=2.1.0",
    "pydantic-extra-types[cron]>=2.11.1",
    "sqlalchemy>=2.0.52",
    "sentry-sdk==2.68.1",
    "uvicorn>=0.52.4",
    "json5>=0.15.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.16.5",
    "ty>=0.0.75",
]
build = [
    "nuitka[all]>=4.2",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
