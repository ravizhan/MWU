[project]
name = "MWU"
version = "0.21.0"
description = "基于 Vue 的 通用 GUI。由 MaaFramework 强力驱动！"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "apscheduler>=3.11.3",
    "cron-converter>=2.0.2",
    "fastapi>=0.162.0",
    "httpx>=0.28.1",
    "maafw>=5.14.3",
    "numpy>=2.5.4",
    "pillow>=13.0.0",
    "plyer>=2.1.0",
    "pydantic-extra-types[cron]>=2.11.1",
    "sqlalchemy>=2.1.6",
    "uvicorn>=0.54.0",
    "json5>=0.17.3",
    "sentry-sdk>=2.73.0",
    "cryptography>=50.0.2",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.17.2",
    "ty>=0.0.91",
]
build = [
    "nuitka[all]>=4.3.4",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff.lint]
# 在 ruff 默认规则集之上追加能发现真实问题的规则组
extend-select = [
    "ASYNC",  # 异步函数中的阻塞调用、忙等
    "B",      # bugbear
    "C4",     # 推导式
    "DTZ",    # 无时区 datetime
    "FAST",   # FastAPI
    "FURB",   # refurb
    "G",      # logging 参数惰性格式化
    "LOG",    # logging 用法
    "PERF",   # 性能反模式
    "PIE",
    "PTH",    # pathlib
    "RET",    # return 简化
    "RUF",
    "SIM",    # simplify
    "TRY400", # except 中用 logger.exception 保留堆栈
    "UP",     # pyupgrade
]
ignore = [
    "BLE001",  # 线程/回调边界的 except Exception 兜底是本项目的常规写法
    "RUF001",  # 中文全角标点
    "RUF002",
    "RUF003",
    "TRY004",  # 配置/输入校验统一抛 ValueError（pydantic 校验器也只认 ValueError）
]
