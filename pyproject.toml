[project]
name = "MWU"
version = "0.20.0"
description = "基于 Vue 的 通用 GUI。由 MaaFramework 强力驱动！"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "apscheduler>=3.11.3",
    "cron-converter>=2.0.2",
    "fastapi>=0.162.0",
    "httpx>=0.28.1",
    "maafw>=5.14.3",
    "numpy>=2.5.4",
    "pillow>=13.0.0",
    "plyer>=2.1.0",
    "pydantic-extra-types[cron]>=2.11.1",
    "sqlalchemy>=2.1.6",
    "uvicorn>=0.54.0",
    "json5>=0.17.3",
    "sentry-sdk>=2.73.0"
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.17.2",
    "ty>=0.0.91",
]
build = [
    "nuitka[all]>=4.3.3",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
