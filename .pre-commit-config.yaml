repos:
  - repo: https://github.com/astral-sh/uv-pre-commit
    # uv version.
    rev: 0.12.7
    hooks:
      - id: uv-lock
  - repo: local
    hooks:
      - id: uv-format
        name: uv-format
        entry: uv run ruff format
        language: system
        types: [python]
      - id: pnpm-format
        name: pnpm-format
        # oxfmt 从每个目标文件向上查找 front/.oxfmtrc.json，可在仓库根目录直接运行
        entry: node front/node_modules/oxfmt/bin/oxfmt
        language: system
        files: ^front/
        types: [text]