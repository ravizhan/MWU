name: Release Build
run-name: Building for ${{ github.ref_name }}
on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

jobs:
  vite-build:
    permissions:
      contents: read
    runs-on: ubuntu-24.04
    outputs:
      cache-key: ${{ steps.Store-Cache-Key.outputs.cache-key }}
    defaults:
      run:
        working-directory: ./front
    steps:
      - name: Check-out repository
        uses: actions/checkout@v6

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11
          run_install: false
          package_json_file: 'front/package.json'

      - name: Use Node.js 24
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: "pnpm"
          cache-dependency-path: 'front/pnpm-lock.yaml'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Frontend
        run: pnpm run build

      - name: Store Cache Key
        id: Store-Cache-Key
        run: echo "cache-key=frontpage-dist-${{ hashFiles('page/**') }}" >> "$GITHUB_OUTPUT"

      - name: Cache
        uses: actions/cache@v5.0.3
        with:
          path: page
          key: ${{ steps.Store-Cache-Key.outputs.cache-key }}

  build:
    env:
      UV_INDEX: https://pypi.org/simple
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            platform: linux
            arch: x86_64

          - os: ubuntu-24.04-arm
            platform: linux
            arch: aarch64

          - os: macos-15-intel
            platform: macos
            arch: x86_64

          - os: macos-15
            platform: macos
            arch: aarch64

          - os: windows-2025
            platform: win
            arch: x86_64

          - os: windows-11-arm
            platform: win
            arch: aarch64
    runs-on: ${{ matrix.os }}
    name: Build (${{ matrix.platform }}-${{ matrix.arch }})
    needs: vite-build

    steps:
      - name: Check-out repository
        uses: actions/checkout@v6

      - name: 'Workaround for missing zstd in windows-11-arm'
        if: matrix.os == 'windows-11-arm'
        run: choco install zstandard

      - name: Restore cached frontend artifacts
        uses: actions/cache@v5.0.3
        with:
          path: page
          key: ${{ needs.vite-build.outputs.cache-key }}
          enableCrossOsArchive: true
          fail-on-cache-miss: true

      - name: Setup ccache
        if: ${{ matrix.platform == 'linux' }}
        shell: bash
        run: |
          sudo apt-get install -y ccache

      - name: Install uv
        uses: astral-sh/setup-uv@v7.5.0
        with:
          enable-cache: true

      - name: Setup Python
        uses: actions/setup-python@v6.2.0
        with:
          python-version-file: ".python-version"

      - name: Setup Go
        uses: actions/setup-go@v6.3.0
        with:
          go-version-file: 'updater/go.mod'
          cache-dependency-path: "updater/go.sum"

      - name: Install Dependencies
        run: uv sync --group build

      - name: Setup Environment Variables
        shell: bash
        run: |
          echo "NUITKA_CACHE_DIR=${{ runner.temp }}/nuitka/cache" >> $GITHUB_ENV
          echo "PYTHON_VERSION=$(python --version | awk '{print $2}' | cut -d '.' -f 1,2)" >> $GITHUB_ENV

      - name: Cache Nuitka cache directory
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: ${{ env.NUITKA_CACHE_DIR }}
          key: nuitka-${{ runner.os }}-${{ runner.arch }}-python-${{ env.PYTHON_VERSION }}-nuitka-${{ github.sha }}
          restore-keys: |
            nuitka-${{ runner.os }}-${{ runner.arch }}-python-${{ env.PYTHON_VERSION }}-
            nuitka-${{ runner.os }}-${{ runner.arch }}-

      - name: Build Executable
        if: ${{ matrix.os == 'windows-11-arm' || matrix.os == 'windows-2025' }}
        run: uv run python -m nuitka --standalone --lto=yes --windows-icon-from-ico=logo.jpg --assume-yes-for-downloads --user-package-configuration-file=nuitka-package.config.yml --output-dir=build --include-package=PIL --include-package=maa --include-package=sentry_sdk -o MWU main.py

      - name: Build Executable
        if: ${{ matrix.platform == 'linux' }}
        run: uv run python -m nuitka --standalone --lto=yes --linux-icon=logo.jpg --assume-yes-for-downloads --user-package-configuration-file=nuitka-package.config.yml --output-dir=build --include-package=PIL --include-package=maa --include-package=sentry_sdk -o MWU main.py

      - name: Build Executable
        if: ${{ matrix.platform == 'macos' }}
        run: uv run python -m nuitka --standalone --lto=yes --macos-app-icon=logo.jpg --assume-yes-for-downloads --user-package-configuration-file=nuitka-package.config.yml --output-dir=build --include-package=PIL --include-package=maa --include-package=sentry_sdk -o MWU main.py

      - name: Build Updater
        if: ${{ matrix.platform != 'win' }}
        shell: bash
        run: |
          pushd updater
          if [ "${{ matrix.arch }}" = "x86_64" ]; then
            ARCH=amd64
          else
            ARCH=arm64
          fi
          if [ "${{ matrix.platform }}" = "linux" ]; then
            GOOS=linux GOARCH=$ARCH go build -ldflags '-w -s' -o ../build/main.dist/mwu-updater .
          else
            GOOS=darwin GOARCH=$ARCH go build -ldflags '-w -s' -o ../build/main.dist/mwu-updater .
          fi
          popd

      - name: Build Updater
        if: ${{ matrix.platform == 'win' }}
        shell: pwsh
        run: |
          Push-Location updater
          if ("${{ matrix.arch }}" -eq "x86_64") {
            $env:GOOS = "windows"
            $env:GOARCH = "amd64"
          } else {
            $env:GOOS = "windows"
            $env:GOARCH = "arm64"
          }
          go build -ldflags '-w -s' -o ..\build\main.dist\mwu-updater.exe .
          Pop-Location

      - name: Copy Resources to Build
        shell: bash
        run: |
          cp -r "page" "build/main.dist/page"
          git clone "https://github.com/MaaXYZ/MaaAgentBinary" "build/main.dist/MaaAgentBinary"
          git -C "build/main.dist/MaaAgentBinary" checkout 173d43c4b5518064b27720b0cf08c781f291eba9

      - name: Create Version file
        run: echo "${{ github.ref_name }}" >> build/main.dist/version

      - name: Compress Build
        run: 7z a -t7z -mx=9 -myx=9 -mmt -ms=e -mqs=on -mf=BCJ2 -r MWU-${{ matrix.platform }}-${{ matrix.arch }}-${{ github.ref_name }}.7z "./build/main.dist/*"

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v7
        with:
          name: MWU-${{ matrix.platform }}-${{ matrix.arch }}-${{ github.ref_name }}
          path: MWU-${{ matrix.platform }}-${{ matrix.arch }}-${{ github.ref_name }}.7z

  release:
    if: ${{ startsWith(github.ref, 'refs/tags/') }}
    permissions:
      contents: write
    runs-on: ubuntu-24.04
    needs: build
    steps:
      - name: Check-out repository
        uses: actions/checkout@v6

      - name: Download All Artifacts
        uses: actions/download-artifact@v8.0.1
        with:
          path: artifacts
          pattern: MWU-*-*-${{ github.ref_name }}
          merge-multiple: true

      - name: Setup Python
        uses: actions/setup-python@v6.2.0
        with:
          python-version-file: ".python-version"

      - name: Install uv
        uses: astral-sh/setup-uv@v7.5.0
        with:
          enable-cache: true

      - name: Generate Release Notes
        id: generate_notes
        env:
          API_KEY: ${{ secrets.API_KEY }}
        run: uv run python .github/scripts/generate_release_notes.py

      - name: Create Release
        uses: ncipollo/release-action@v1.20.0
        with:
          draft: true
          allowUpdates: true
          artifacts: artifacts/*.7z
          body: ${{ steps.generate_notes.outputs.notes }}
          name: 'Release ${{ github.ref_name }}'
