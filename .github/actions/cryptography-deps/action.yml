name: cryptography build deps
description: cryptography 在 Windows ARM64 与 macOS x86_64 上没有预编译 wheel，为源码构建准备静态 OpenSSL（Rust 已预装在 runner 镜像中）
runs:
  using: composite
  steps:
    - name: Static OpenSSL (macOS x86_64)
      if: runner.os == 'macOS' && runner.arch == 'X64'
      shell: bash
      env:
        HOMEBREW_NO_AUTO_UPDATE: "1"
      run: |
        brew install openssl@3
        echo "OPENSSL_DIR=$(brew --prefix openssl@3)" >> "$GITHUB_ENV"
        echo "OPENSSL_STATIC=1" >> "$GITHUB_ENV"

    - name: Static OpenSSL (Windows ARM64)
      if: runner.os == 'Windows' && runner.arch == 'ARM64'
      shell: pwsh
      run: |
        & "$env:VCPKG_INSTALLATION_ROOT\vcpkg.exe" install openssl:arm64-windows-static-md
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
        "OPENSSL_DIR=$env:VCPKG_INSTALLATION_ROOT\installed\arm64-windows-static-md" >> $env:GITHUB_ENV
        "OPENSSL_STATIC=1" >> $env:GITHUB_ENV
